name: Web Push reminders
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: web-push-reminders
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check reminders using the saved account schedule
        env:
          CRON_SECRET: ${{ secrets.WEB_PUSH_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Configure the WEB_PUSH_CRON_SECRET repository secret first."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 65 \
            --header "Authorization: Bearer $CRON_SECRET" \
            'https://smart-balance-ia.vercel.app/api/cron/web-push?source=github'
